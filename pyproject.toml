[project]
name = "truth"
version = "0.1.0"
description = "AI-powered misinformation verification backend and pipeline"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<0.28",
    "tenacity>=8.5,<9",
    "google-genai>=0.3,<1.0",
    "spacy>=3.7,<3.8",
    "rank-bm25>=0.2.2,<0.3",
    "snowballstemmer>=2.2,<3",
    "sentence-transformers>=3.0,<4",
    "faiss-cpu>=1.8,<1.9",
    "torch>=2.3,<2.4",
    "wikipedia-api>=0.6,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx", "ruff", "pytest-cov"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that need real API keys/network/models",
]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
